apiVersion: v1
kind: Service
metadata:
  name: vproapp-service
spec:
  type: ClusterIP  # Optional, as ClusterIP is the default type
  selector:
    app: vproapp  # Must match the labels on your target Pods
  ports:
  - name: vproapp-svc-port
    protocol: TCP
    port: 8080              # Port exposed internally by the Service
    targetPort: vproapp-port # Port the container is actually listening on
