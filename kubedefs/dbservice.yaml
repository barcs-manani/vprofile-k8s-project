apiVersion: v1
kind: Service
metadata:
  name: vprodb # Check application.properties file, the port needs to resolve to this service
  # namespace: default
spec:
  type: ClusterIP  # Optional, as ClusterIP is the default type
  selector:
    app: vprodb    # Must match the labels on your target Pods
  ports:
    - name: vprodb-svc-port
      protocol: TCP
      port: 3306              # Port exposed internally by the Service
      targetPort: vprodb-port # Port the container is actually listening on
