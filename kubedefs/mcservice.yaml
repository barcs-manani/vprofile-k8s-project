apiVersion: v1
kind: Service
metadata:
  name: vprocache01 # Check application.properties file, the port needs to resolve to this service
  # namespace: default
spec:
  type: ClusterIP  # Optional, as ClusterIP is the default type
  selector:
    app: vpromc    # Must match the labels on your target Pods
  ports:
  - name: vpromc-svc-port
    protocol: TCP
    port: 11211              # Port exposed internally by the Service
    targetPort: vpromc-port # Port the container is actually listening on
