apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vpro-ingress
  # labels:
  #   app.kubernetes.io/name: vpro-ingress
  annotations: # Skeleton
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: vprofile.barcsmanani.online
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: vproapp-service
            port: 
              number: 8080